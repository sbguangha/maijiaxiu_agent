<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>买家秀批量生成</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-icon">🛍️</div>
      <div>
        <h1>买家秀批量生成</h1>
        <p class="subtitle">从飞书需求表读取 · 自动生成评价和晒图 · 入队微信发送</p>
      </div>
    </header>

    <div class="toolbar">
      <button id="previewBtn" class="btn btn-secondary">读取需求表</button>
      <button id="generateBtn" class="btn btn-primary" disabled>开始批量生成</button>
      <span id="statusBadge" class="status-badge hidden"></span>
    </div>

    <div id="progressArea" class="progress-area hidden">
      <div class="progress-bar-track">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
      <p id="progressText" class="progress-text">准备中...</p>
    </div>

    <div id="tableArea" class="table-area">
      <div class="empty-state">
        <p>点击「读取需求表」从飞书加载商品列表</p>
      </div>
    </div>

    <div id="approvalArea" class="approval-area hidden"></div>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
